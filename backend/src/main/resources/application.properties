# MongoDB
# - Prefer setting `SPRING_DATA_MONGODB_URI` (or `SPRING_MONGODB_URI`) in your environment.
# - Defaults to a local MongoDB instance with no credentials.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:mongodb://localhost:27017/kavyaprodb}}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:kavyaprodb}
spring.data.mongodb.auto-index-creation=true

# Server Port
server.port=${PORT:8080}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CORS Configuration
server.servlet.context-path=/
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001,https://kavyaproman.netlify.app}

# SendGrid (optional)
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:kavyalearn.info@gmail.com}
# email delivery preference: sendgrid | smtp | auto
email.delivery.prefer=${EMAIL_DELIVERY_PREFER:auto}

# Contact Sales email receiver + frontend URL used in verification links
contact.receiver.email=${CONTACT_RECEIVER_EMAIL:kavyalearn.info@gmail.com}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Cloudinary (media storage)
# Provide via env vars; do not hard-code secrets here.
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.secure=${CLOUDINARY_SECURE:true}
