# MongoDB
# Spring Boot 4 uses `spring.mongodb.*` (not `spring.data.mongodb.*`) for connection settings.
# - Prefer setting `SPRING_MONGODB_URI` in your environment.
# - `SPRING_DATA_MONGODB_URI` is supported as a legacy fallback.
# - Defaults to a local MongoDB instance with no credentials.
spring.mongodb.uri=${SPRING_MONGODB_URI:}
spring.mongodb.database=${SPRING_MONGODB_DATABASE:${SPRING_DATA_MONGODB_DATABASE:kavyaprodb}}
spring.data.mongodb.auto-index-creation=true
 
# Server Port
server.port=${PORT:8080}
 
# Multipart upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
 
# CORS Configuration
server.servlet.context-path=/
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001,https://kavyaproman.netlify.app}
 
# SendGrid (optional)
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:kavyaproman.info@gmail.com}
# email delivery preference: sendgrid | smtp | auto
email.delivery.prefer=${EMAIL_DELIVERY_PREFER:}
 
# Contact Sales email receiver + frontend URL used in verification links
contact.receiver.email=${CONTACT_RECEIVER_EMAIL:kavyaproman.info@gmail.com}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
 
 

