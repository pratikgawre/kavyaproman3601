# MongoDB: use env var if provided; fallback to local instance.
spring.mongodb.uri=${SPRING_MONGODB_URI:}
spring.data.mongodb.auto-index-creation=false
 
# Server Port
server.port=${PORT:8080}
 
# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
 
# CORS Configuration
server.servlet.context-path=/
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001,https://kavyaproman.netlify.app}
 
# SendGrid API key (optional) - set as environment variable SENDGRID_API_KEY in production
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:kavyalearn.info@gmail.com}
# email delivery preference: sendgrid | smtp | auto
email.delivery.prefer=${EMAIL_DELIVERY_PREFER:}
 
# Contact Sales email receiver + frontend URL used in verification links
contact.receiver.email=${CONTACT_RECEIVER_EMAIL:kavyalearn.info@gmail.com}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
 
 
