# Production application properties
spring.application.name=KavyaProMan300

# MongoDB configuration
spring.mongodb.uri=${MONGODB_URI:${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/kavyaprodb}}}
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://kavyaproman.netlify.app}

# SendGrid Email Configuration
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:kavyalearn.info@gmail.com}
email.delivery.prefer=${EMAIL_DELIVERY_PREFER:sendgrid}

# Contact Sales email receiver + frontend URL used in verification links
contact.receiver.email=${CONTACT_RECEIVER_EMAIL:kavyalearn.info@gmail.com}
frontend.base-url=${FRONTEND_BASE_URL:https://kavyaproman.netlify.app}

# SMTP mail settings
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${EMAIL_HOST:smtp.gmail.com}
spring.mail.default-encoding=UTF-8

# Logging Configuration
logging.level.root=INFO
logging.level.com.team1.backend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

